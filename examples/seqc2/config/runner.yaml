# runner.yaml — seqc2 run execution config
#
# Modeled on examples/seq2neo/config/runner.yaml. Unlike seq2neo, the defaults
# are resolved relative to this example directory, so no edits are needed
# before first use — including on an rsynced copy of the repo, as long as the
# /t9k data mounts are the same.
#
# All values can be overridden at runtime via CLI flags.

# ── Nextflow pipeline ─────────────────────────────────────────────────────
# Leave empty to auto-resolve from the repo location (recommended).
main_nf:  ""        # default: <repo>/main.nf
rdv_conf: ""        # default: <examples/seqc2>/seqc2.shared.config

# ── Conda / Nextflow env ───────────────────────────────────────────────────
nxf_conda_cachedir: /t9k/mnt/joey/nf_conda_envs
nxf_conda_usemamba: "true"
micromamba_env: nextflow          # micromamba run -n <this>

# ── Network proxy (leave empty to disable) ────────────────────────────────
# Needed even for -offline runs: the nextflow launcher phones home for a
nextflow_work_dir: /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/pipeline/nf_work
# version check and hangs without network access on this host.
https_proxy: "http://127.0.0.1:7890"

# ── Data root (all relative paths below are anchored here) ────────────────
# Code (scripts/) is in the repo; outputs go under seqc2_root.
seqc2_root: ""                    # default: this example directory

input_csv:   csv/seqc2_wes_ll.csv  # BAM samplesheet (patient,status,sample,lane,bam,bai)
outdir:      output/seqc2.wes.ll   # nextflow output dir
state_file:  runs/run_state.json   # resume state tracker

# ── Execution ─────────────────────────────────────────────────────────────
dry_run: false
resume:  true    # pass -resume to nextflow
offline: true    # pass -offline to nextflow

# ── Completion check ──────────────────────────────────────────────────────
# All completion_artifacts globs must match ≥1 file under the outdir.
completion_artifacts:
  - "**/pipeline_info/execution_trace*.txt"
  - "consensus/**/*.consensus.vcf.gz"
