# HG008 WGS hybrid benchmark: Illumina DNA BAMs plus RNA FASTQs.
main_nf: ""
rdv_conf: seqc2.hybrid.hg008.wgs.config
nxf_conda_cachedir: /t9k/mnt/joey/nf_conda_envs
nxf_conda_usemamba: "true"
micromamba_env: nextflow
https_proxy: "http://127.0.0.1:7890"
seqc2_root: ""
input_csv: csv/hg008_wgs_hybrid.csv
outdir: output/hg008.wgs.hybrid
state_file: runs/hg008_wgs_hybrid_state.json
dry_run: false
resume: true
offline: true
completion_artifacts:
  - "**/pipeline_info/execution_trace*.txt"
  - "**/vcf_realignment/rescue/**/*.rescue.filtered.stripped.vep.vcf.gz"
  - "**/vcf_realignment/rescue/**/*.rescue.filtered.stripped.vep.vcf.gz.tbi"
