# runner.yaml — seq2neo batch execution config
#
# The only values you need to set before first use:
#   main_nf      — absolute path to rnadnavar/main.nf on this machine
#   rdv_conf     — absolute path to seq2neo.shared.config on this machine
#   seq2neo_root — where data/output/state will be written
#
# Everything else has sensible defaults.
# All values can be overridden at runtime via CLI flags.

# ── Nextflow pipeline ─────────────────────────────────────────────────────
# Set these to wherever the rnadnavar repo lives on this machine.
main_nf:  /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/pipeline/rnadnavar/main.nf
rdv_conf: /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/pipeline/rnadnavar/examples/seq2neo/seq2neo.shared.config

# ── Conda / Nextflow env ───────────────────────────────────────────────────
nxf_conda_cachedir: /t9k/mnt/joey/nf_conda_envs
nxf_conda_usemamba: "true"
micromamba_env: nextflow          # micromamba run -n <this>

# ── Network proxy (leave empty to disable) ────────────────────────────────
https_proxy: "http://10.233.17.241:3128"

# ── Data root (all relative paths below are anchored here) ────────────────
# Code (scripts/) is in the repo; everything else goes under seq2neo_root.
seq2neo_root: /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/work/seq2neo

merged_json: data/processed/merged.json   # input: parsed sample database
csv_dir:     runs/csv                     # generated per-sample nextflow CSVs
outdir_base: output                       # per-sample nextflow output dirs
state_file:  runs/run_state.json          # resume state tracker

# ── Execution ─────────────────────────────────────────────────────────────
lane: LX
dry_run: false
resume:  true    # pass -resume to nextflow
offline: true    # pass -offline to nextflow
max_parallel: 1  # samples to run concurrently (1 = sequential)

# ── Retry policy ──────────────────────────────────────────────────────────
max_retries: 2

# ── Completion check ──────────────────────────────────────────────────────
# All completion_artifacts globs must match ≥1 file.
# At least one rescue_success_patterns glob must match.
completion_artifacts:
  - "**/pipeline_info/execution_trace*.txt"

rescue_success_patterns:
  - "rescue/**/*.filtered.vcf.gz"
  - "vcf_realignment/rescue/**/*.filtered.vcf.gz"
  - "rescue/**/*.rescued.vcf.gz"
  - "vcf_realignment/rescue/**/*.rescued.vcf.gz"

fail_on_failed_trace: true
trace_file_pattern: "**/pipeline_info/execution_trace*.txt"
failed_trace_statuses:
  - "FAILED"
failed_trace_process_regex: "STAR_ALIGN|FASTQ_ALIGN_STAR|RNA_REALIGNMENT_WORKFLOW|SECOND_RESCUE_WORKFLOW|VCF_RESCUE|RNA_FILTERING|FILTER_RNA_MUTATIONS"
