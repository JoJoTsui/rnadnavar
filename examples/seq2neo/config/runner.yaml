# runner.example.yaml — copy to runner.yaml and fill in your paths
# All values here can be overridden via CLI: --key value

# ── Nextflow pipeline ──────────────────────────────────────────────────────
main_nf: /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/pipeline/rnadnavar/main.nf
rdv_conf: /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/pipeline/rnadnavar/examples/seq2neo/seq2neo.shared.config

# ── Conda / Nextflow env ───────────────────────────────────────────────────
nxf_conda_cachedir: /t9k/mnt/joey/nf_conda_envs
nxf_conda_usemamba: "true"
micromamba_env: nextflow          # micromamba run -n <this>

# ── Network proxy (leave empty to disable) ────────────────────────────────
https_proxy: "http://10.233.17.241:3128"

# ── Paths ─────────────────────────────────────────────────────────────────
seq2neo_root: /t9k/mnt/WorkSpace/data/ngs/xuzhenyu/work/seq2neo
merged_json:  data/processed/merged.json   # relative to seq2neo_root
csv_dir:      runs/csv                     # per-sample CSV inputs
outdir_base:  output                       # per-sample output dirs
state_file:   runs/run_state.json          # resume state

# ── Execution ─────────────────────────────────────────────────────────────
lane: LX
dry_run: false
resume: true                  # pass -resume to nextflow
offline: true                 # pass -offline to nextflow
max_parallel: 1               # samples to run concurrently (1 = sequential)

# ── Retry policy ──────────────────────────────────────────────────────────
max_retries: 1

# ── Completion check ──────────────────────────────────────────────────────
# Artifacts that must exist under outdir/<patient_id>/ for a run to be
# considered successfully completed (glob patterns, all must match).
completion_artifacts:
  - "**/*.filtered.vcf.gz"
  - "**/pipeline_info/execution_trace*.txt"
