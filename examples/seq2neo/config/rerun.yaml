# rerun.yaml — seq2neo consensus+rescue-only rerun config (ticket 08 / audit M5)
#
# Regenerates consensus + rescue VCFs from EXISTING per-caller VCFs.
# FASTQ→BAM alignment and per-caller variant calling are structurally
# unreachable: --step consensus + tools without any caller names, and the
# generated samplesheets contain VCF rows only (no fastq/bam/cram).
#
# The only values you need to set before first use:
#   main_nf      — absolute path to rnadnavar/main.nf on this machine
#   rdv_conf     — absolute path to seq2neo.shared.config on this machine
#   seq2neo_root — where manifests/state will be read and outputs written
#
# All values can be overridden at runtime via CLI flags.

# ── Nextflow pipeline ─────────────────────────────────────────────────────
main_nf:  /t9k/mnt/hdd/work/Vax/pipeline/rnadnavar/main.nf
rdv_conf: /t9k/mnt/hdd/work/Vax/pipeline/rnadnavar/examples/seq2neo/seq2neo.shared.config

# ── Conda / Nextflow env ───────────────────────────────────────────────────
nxf_conda_cachedir: /t9k/mnt/joey/nf_conda_envs
nxf_conda_usemamba: "true"
micromamba_env: nextflow          # micromamba run -n <this>

# ── Network proxy (leave empty to disable) ────────────────────────────────
https_proxy: "http://10.233.17.241:3128"

# ── Data root (all relative paths below are anchored here) ────────────────
seq2neo_root: /t9k/mnt/hdd/work/Vax/pipeline/rnadnavar/examples/seq2neo

manifest_tsv: data/processed/sample_manifest.tsv  # input: cohort sample list
csv_dir:      runs/rerun_csv                      # generated per-sample VCF samplesheets
outdir_base:  output_reconsensus_native_gated      # NEW per-sample rerun output dirs
state_file:   runs/rerun_state.json               # resume state tracker
checksum_dir: runs/rerun_checksums                # per-sample input checksum manifests

# ── Rerun entry point (do not change; enforced by the driver) ─────────────
# step 'consensus' enters after variant calling; VCF_NORMALIZE now runs first
# (M5 fix), then consensus → rescue → rescue post-processing.
step:  consensus
# No caller names: no variant-calling process can be triggered.
tools: consensus,rescue,filtering,vep
# Validated default policy; pass explicit flags so dry-runs are reproducible.
native_evidence_snv: true
rescue_promotion_enabled: true
rescue_min_dna_callers: 1
rescue_min_rna_callers: 2
rescue_veto: dna
extra_nextflow_args: []

# ── Execution ─────────────────────────────────────────────────────────────
dry_run: false
resume:  true    # pass -resume to nextflow
offline: true    # pass -offline to nextflow
max_retries: 2

# ── Completion check ──────────────────────────────────────────────────────
# All completion_artifacts globs must match ≥1 file.
# At least one consensus and one rescue pattern must match.
# Strict: the true final deliverables are the FILTERED VCFs (standard +
# stripped) for the consensus branches and the rescue branch; the
# intermediate *.rescued.vcf.gz alone is NOT completion.
completion_artifacts:
  - "**/pipeline_info/execution_trace*.txt"
  - "filtered/**/*.filtered.vcf.gz"
  - "filtered/**/*.filtered.vcf.stripped.vcf.gz"
  - "rescue/**/*.filtered.vcf.gz"
  - "rescue/**/*.filtered.vcf.stripped.vcf.gz"

consensus_success_patterns:
  - "consensus/**/*.vcf.gz"

rescue_success_patterns:
  - "rescue/**/*.filtered.vcf.gz"
