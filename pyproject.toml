[project]
name = "rnadnavar"
version = "1.0.0"
description = "RNA and DNA integrated analysis for somatic mutation detection"
requires-python = ">=3.10"
dependencies = [
    "altair>=6.1.0",
    "cyvcf2>=0.33.0",
    "pandas>=2.3.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pysam>=0.24.0",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bin*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
